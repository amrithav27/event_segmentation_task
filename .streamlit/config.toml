# Videos in static/videos/ are served at /app/static/videos/<file>.mp4 so the
# player can stream them progressively. Without this the URL silently falls
# back to Streamlit's index.html and the video area stays black.
[server]
enableStaticServing = true

[browser]
gatherUsageStats = false

# No [theme] base is set on purpose: Streamlit then follows the operating
# system's light/dark setting, and the video player follows Streamlit.
