<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Boundary player</title>
<style>
  :root {
    --bg: #0e1117;
    --fg: #fafafa;
    --muted: #9aa0a6;
    --accent: #4c8bf5;
    --mark: #ffb703;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* The stage is sized in JS to the browser viewport, so the video gets the
     whole screen. Height is set on #stage rather than on the video so the
     overlay and flash, which are absolutely positioned against it, follow. */
  #stage {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    outline: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    display: block;
    width: 100%;
    height: 100%;
    /* `contain` letterboxes rather than crops: the participant always sees
       the entire frame, whatever the video's aspect ratio. */
    object-fit: contain;
    background: #000;
  }
  /* Click-to-start overlay. Clicking also gives the iframe keyboard focus,
     which is what makes the key listeners work at all. */
  #overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    background: rgba(0, 0, 0, 0.88);
    cursor: pointer;
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 1.35rem; font-weight: 600; }
  #overlay p { margin: 0; color: var(--muted); font-size: 0.95rem; max-width: 46ch; }
  #overlay .cta {
    margin-top: 6px; padding: 10px 22px;
    background: var(--accent); color: #fff;
    border-radius: 6px; font-weight: 600;
  }
  /* Transient flash confirming a mark registered. Deliberately shows no
     running count, so participants are not nudged toward a target rate. */
  #flash {
    position: absolute; inset: 0;
    border: 4px solid var(--mark);
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
  }
  #flash.on { animation: pulse 260ms ease-out; }
  @keyframes pulse { from { opacity: 0.95; } to { opacity: 0; } }

  /* Shown while the video is paused, so the state is never ambiguous. */
  #paused {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.45);
    pointer-events: none;
    font-size: 2.2rem; font-weight: 700; letter-spacing: 0.08em;
  }
  #paused.on { display: flex; }

  /* Progress bar and mark strip. Tall on purpose: the marks on it are drag
     targets, and a 14px strip is too fine to grab without pixel-hunting.
     It is not clickable -- seeking forward is not offered at all. */
  #bar {
    position: relative;
    width: 100%; height: 46px;
    margin-top: 8px;
    background: #262730;
    border-radius: 4px;
    touch-action: none;   /* a drag must not scroll the page instead */
  }
  #bar-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0; background: rgba(76, 139, 245, 0.30);
    border-radius: 4px 0 0 4px;
    pointer-events: none;
  }
  /* A wide, invisible grab zone around a thin visible line, with a knob at
     the top so it reads as something you can take hold of. */
  .tick {
    position: absolute; top: 0; bottom: 0;
    width: 24px; margin-left: -12px;
    cursor: grab;
    touch-action: none;
  }
  .tick::before {
    content: "";
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 3px; margin-left: -1.5px;
    background: var(--mark);
  }
  .tick::after {
    content: "";
    position: absolute; top: 5px; left: 50%;
    width: 14px; height: 14px; margin-left: -7px;
    background: var(--mark); border-radius: 50%;
    border: 2px solid var(--bg);
  }
  .tick:hover::before, .tick.dragging::before { background: #ffd166; }
  .tick:hover::after,  .tick.dragging::after  { background: #ffd166; }
  .tick.dragging { cursor: grabbing; }
  #hint {
    padding: 8px 2px 0;
    color: var(--muted);
    font-size: 0.88rem;
    display: flex; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
  }
  #keys { color: var(--muted); font-size: 0.84rem; padding-top: 4px; }
  kbd {
    background: #262730; border: 1px solid #3a3b46; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font-family: inherit;
    font-size: 0.82rem; color: var(--fg);
  }
  #warn { color: #f0a202; }
  #err { padding: 16px; color: #ff6b6b; font-size: 0.95rem; display: none; }
</style>
</head>
<body>
<div id="stage" tabindex="0">
  <video id="vid" playsinline preload="auto" disablepictureinpicture></video>
  <div id="flash"></div>
  <div id="paused">PAUSED</div>
  <div id="overlay">
    <h2 id="ov-title">Click here to start</h2>
    <p id="ov-body"></p>
    <div class="cta">Click to begin</div>
  </div>
</div>
<div id="bar"><div id="bar-fill"></div></div>
<div id="hint">
  <span id="hint-left"></span>
  <span id="warn"></span>
</div>
<div id="keys">
  <kbd>Enter</kbd> mark a boundary &nbsp;·&nbsp;
  <kbd>Space</kbd> play / pause &nbsp;·&nbsp;
  <kbd>&larr;</kbd> rewind <span id="k-rewind">5</span>s &nbsp;·&nbsp;
  <kbd>Backspace</kbd> undo last mark &nbsp;·&nbsp;
  drag a mark to adjust its timing
</div>
<div id="err"></div>

<script>
/* ------------------------------------------------------------------ *
 * Minimal, hand-rolled implementation of the Streamlit component
 * protocol. It is just postMessage, so no npm build step is needed and
 * the app stays a pure `pip install streamlit` dependency.
 * ------------------------------------------------------------------ */
const Streamlit = {
  ready() {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
  },
  setHeight(h) {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h }, "*");
  },
  setValue(v) {
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: v, dataType: "json" }, "*");
  },
};

/* Both come from config.py via render(); these are only fallbacks. */
let REWIND_SEC = 5;        // left arrow step
let DRAG_LIMIT = 10;       // how far a mark may be dragged, either way

const stage   = document.getElementById("stage");
const vid     = document.getElementById("vid");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ov-title");
const ovBody  = document.getElementById("ov-body");
const flash   = document.getElementById("flash");
const pausedEl= document.getElementById("paused");
const bar     = document.getElementById("bar");
const barFill = document.getElementById("bar-fill");
const hintL   = document.getElementById("hint-left");
const warn    = document.getElementById("warn");
const errBox  = document.getElementById("err");

let token = null;          // identifies this viewing; guards against restarts
let started = false;
let finished = false;
/* One per Enter press. Only t_video and t_wall are saved; t_video_raw and
   adjusted exist so a drag can be clamped to the original keypress, and stay
   client-side. */
let marks = [];
let blurEvents = 0;        // times the participant left the tab/window
let pauseCount = 0;
let rewindCount = 0;
let dragging = null;       // {el, index} while a mark is being dragged
let maxReached = 0;        // furthest point actually reached
let startedWallMs = null;

/* Chrome below the video inside this frame: bar + hint + key legend. */
const CHROME_PX = 112;
/* Breathing room so the parent page never gains a scrollbar. */
const SAFETY_PX = 12;

/* How far down the parent page this iframe starts -- Streamlit's header plus
   whatever the app renders above the player. Measured rather than guessed,
   because it changes with the heading text and the Streamlit version. */
function frameTop() {
  try {
    const fe = window.frameElement;
    if (fe) return Math.max(0, fe.getBoundingClientRect().top);
  } catch (e) { /* cross-origin: fall through */ }
  return 150;
}

function viewportHeight() {
  try {
    const h = window.parent.innerHeight;
    if (h && h > 200) return h;
  } catch (e) { /* cross-origin: fall through */ }
  return window.screen.availHeight || 800;
}

function syncHeight() {
  const avail = viewportHeight() - frameTop() - CHROME_PX - SAFETY_PX;
  const target = Math.max(240, avail);
  stage.style.height = target + "px";
  Streamlit.setHeight(target + CHROME_PX);
}

function fmt(sec) {
  const s = Math.max(0, Math.round(sec));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function redrawTicks() {
  for (const el of bar.querySelectorAll(".tick")) el.remove();
  if (!vid.duration) return;
  marks.forEach((m, i) => {
    const el = document.createElement("div");
    el.className = "tick";
    el.style.left = (100 * m.t_video / vid.duration) + "%";
    el.dataset.index = String(i);
    el.title = "Drag to adjust when this boundary happened";
    el.addEventListener("pointerdown", startDrag);
    bar.appendChild(el);
  });
}

/* Marks are placed by keypress, so they land a reaction time late. Dragging
   corrects that. The movement is clamped to DRAG_LIMIT seconds either side of
   where the key actually went down, so a mark can be nudged into place but
   not relocated to a different part of the activity. */
function startDrag(e) {
  if (!started || finished) return;
  e.preventDefault();
  const el = e.currentTarget;
  el.classList.add("dragging");
  el.setPointerCapture(e.pointerId);
  dragging = { el: el, index: Number(el.dataset.index) };
  el.addEventListener("pointermove", onDrag);
  el.addEventListener("pointerup", endDrag);
  el.addEventListener("pointercancel", endDrag);
}

function onDrag(e) {
  if (!dragging || !vid.duration) return;
  const m = marks[dragging.index];
  const r = bar.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  const lo = Math.max(0, m.t_video_raw - DRAG_LIMIT);
  const hi = Math.min(vid.duration, m.t_video_raw + DRAG_LIMIT);
  m.t_video = Number(Math.min(hi, Math.max(lo, frac * vid.duration)).toFixed(3));
  m.adjusted = Math.abs(m.t_video - m.t_video_raw) > 0.001;
  dragging.el.style.left = (100 * m.t_video / vid.duration) + "%";
  const delta = m.t_video - m.t_video_raw;
  warn.textContent = delta === 0 ? ""
    : `Mark moved ${delta < 0 ? "back" : "forward"} ${Math.abs(delta).toFixed(1)}s.`;
  updateHint();
}

function endDrag() {
  if (!dragging) return;
  const el = dragging.el;
  el.classList.remove("dragging");
  el.removeEventListener("pointermove", onDrag);
  el.removeEventListener("pointerup", endDrag);
  el.removeEventListener("pointercancel", endDrag);
  dragging = null;
  setTimeout(() => {
    if (warn.textContent.startsWith("Mark moved")) warn.textContent = "";
  }, 2000);
  redrawTicks();   // reattach handles with fresh positions
  stage.focus();   // keys must keep working after a drag
}

function updateHint() {
  if (!vid.duration) return;
  barFill.style.width = (100 * vid.currentTime / vid.duration) + "%";
  const n = marks.length;
  hintL.textContent =
    `${fmt(vid.currentTime)} / ${fmt(vid.duration)}  -  ${n} boundar${n === 1 ? "y" : "ies"} marked` +
    (n ? "  -  drag a mark to adjust its timing" : "");
}

function render(args) {
  // Only (re)configure on a genuinely new viewing. Streamlit re-sends render
  // messages on every rerun, and we must never restart a video mid-viewing.
  if (args.token === token) { syncHeight(); return; }

  token = args.token;
  started = false; finished = false;
  marks = []; blurEvents = 0; pauseCount = 0; rewindCount = 0;
  maxReached = 0; startedWallMs = null; dragging = null;

  if (args.rewind_sec) REWIND_SEC = args.rewind_sec;
  if (args.drag_limit_sec) DRAG_LIMIT = args.drag_limit_sec;
  document.getElementById("k-rewind").textContent = String(REWIND_SEC);

  vid.muted = !!args.muted;
  vid.src = args.video_url;
  vid.load();

  ovTitle.textContent = args.title || "Click here to start";
  ovBody.textContent = args.subtitle || "";
  overlay.classList.remove("hidden");
  pausedEl.classList.remove("on");
  barFill.style.width = "0%";
  redrawTicks();
  warn.textContent = "";
  errBox.style.display = "none";
  hintL.textContent = "Not started";
  syncHeight();
}

function start() {
  if (started || finished) return;
  started = true;
  startedWallMs = Date.now();
  overlay.classList.add("hidden");
  stage.focus();
  vid.play().catch((e) => {
    errBox.style.display = "block";
    errBox.textContent = "Could not start playback: " + e.message +
      ". Try a different browser (Chrome or Firefox).";
  });
}

/* Deliberately independent of playback state: a mark lands wherever the video
   is sitting, so a participant can rewind to a moment they missed, or pause on
   it, and still record a boundary there. */
function mark() {
  if (!started || finished) return;
  const t = Number(vid.currentTime.toFixed(3));
  marks.push({
    t_video: t,
    t_video_raw: t,
    adjusted: false,
    t_wall: Number(((Date.now() - startedWallMs) / 1000).toFixed(3)),
  });
  flash.classList.remove("on");
  void flash.offsetWidth;          // restart the CSS animation
  flash.classList.add("on");
  redrawTicks();
  updateHint();
}

function undoMark() {
  if (!started || finished || !marks.length) return;
  const gone = marks.pop();
  redrawTicks();
  updateHint();
  warn.textContent = `Removed the mark at ${fmt(gone.t_video)}.`;
  setTimeout(() => {
    if (warn.textContent.startsWith("Removed the mark")) warn.textContent = "";
  }, 2500);
}

function togglePlay() {
  if (!started || finished) return;
  if (vid.paused) vid.play().catch(() => {});
  else vid.pause();
}

/* Rewind only. There is deliberately no forward seek: every boundary should
   be judged from video the participant has actually watched. */
function rewind() {
  if (!started || finished || !vid.duration) return;
  rewindCount += 1;
  vid.currentTime = Math.max(0, vid.currentTime - REWIND_SEC);
}

function finish() {
  if (finished) return;
  finished = true;
  barFill.style.width = "100%";
  pausedEl.classList.remove("on");
  hintL.textContent = "Viewing complete - saving...";
  // Marks are sent in the order they were pressed. Rewinding and dragging
  // both break time order, so anything downstream must sort by boundary_sec
  // rather than assume it.
  Streamlit.setValue({
    token: token,
    status: "completed",
    presses: marks,
    n_presses: marks.length,
    video_duration_sec: Number((vid.duration || 0).toFixed(3)),
    elapsed_sec: Number(((Date.now() - startedWallMs) / 1000).toFixed(3)),
    blur_events: blurEvents,
    pause_count: pauseCount,
    seek_count: rewindCount,
    max_time_reached_sec: Number(maxReached.toFixed(3)),
  });
}

overlay.addEventListener("click", start);

// Listen on the document, not on #stage: events bubble up, so a listener on
// #stage would silently stop firing the moment focus moved to any other
// element inside this frame.
document.addEventListener("keydown", (e) => {
  if (!started) {
    // Any of the transport keys also starts the video.
    if (e.key === "Enter" || e.code === "Space" || e.key.startsWith("Arrow")) {
      e.preventDefault();
      start();
    }
    return;
  }
  switch (e.key) {
    case "Enter":
      e.preventDefault();
      if (!e.repeat) mark();        // held key must not spray boundaries
      break;
    case " ":
      e.preventDefault();
      if (!e.repeat) togglePlay();
      break;
    case "ArrowLeft":  e.preventDefault(); rewind(); break;
    // The other arrows would be forward seeks, so they are swallowed rather
    // than left to scroll the page.
    case "ArrowRight":
    case "ArrowUp":
    case "ArrowDown":  e.preventDefault(); break;
    case "Backspace":
      e.preventDefault();
      if (!e.repeat) undoMark();
      break;
    default:
      if (e.code === "Space") { e.preventDefault(); if (!e.repeat) togglePlay(); }
  }
});

vid.addEventListener("play",  () => pausedEl.classList.remove("on"));
vid.addEventListener("pause", () => {
  if (started && !finished && !vid.ended) {
    pauseCount += 1;
    pausedEl.classList.add("on");
  }
});
vid.addEventListener("timeupdate", () => {
  if (!vid.duration) return;
  if (vid.currentTime > maxReached) maxReached = vid.currentTime;
  updateHint();
  // Safety net: a stall in the last fraction of a second would otherwise
  // strand the participant at the end of a long viewing with no way out.
  if (started && !finished && vid.currentTime >= vid.duration - 0.25) finish();
});
vid.addEventListener("ended", finish);
vid.addEventListener("loadedmetadata", () => { redrawTicks(); updateHint(); });
/* Work out *why* a video would not load and say so, rather than leaving the
   participant with a black rectangle. The common cause is Streamlit's static
   file server being off, in which case the URL answers 200 with the app's own
   index.html instead of the mp4 -- indistinguishable from a black screen
   unless you look at the response. */
function diagnose() {
  errBox.style.display = "block";
  errBox.textContent = "Video failed to load. Checking why...";
  syncHeight();
  fetch(vid.src, { method: "GET", headers: { Range: "bytes=0-0" } })
    .then((r) => {
      const type = (r.headers.get("content-type") || "").toLowerCase();
      if (r.status === 404) {
        errBox.textContent =
          "Video file not found: " + vid.src + " - check that static/videos/ " +
          "contains the four .mp4 files you were sent.";
      } else if (type.startsWith("text/html")) {
        errBox.textContent =
          "The server is not serving video files, so the app returned a web " +
          "page instead of the video - .streamlit/config.toml is probably " +
          "missing. See 'If the video does not play' in the README.";
      } else if (!r.ok) {
        errBox.textContent =
          "Video failed to load (HTTP " + r.status + ") from " + vid.src + ".";
      } else {
        errBox.textContent =
          "The browser could not play this video file. Try Chrome, Edge or " +
          "Firefox.";
      }
      syncHeight();
    })
    .catch(() => {
      errBox.textContent =
        "Video failed to load from " + vid.src + ". Check that the app is " +
        "still running and that static/videos/ is populated.";
      syncHeight();
    });
}

vid.addEventListener("error", diagnose);

// Buffering notice, so a frozen picture is never mistaken for a pause.
let stallTimer = null;
vid.addEventListener("waiting", () => {
  if (!started || finished) return;
  clearTimeout(stallTimer);
  stallTimer = setTimeout(() => {
    if (started && !finished && !vid.paused) {
      warn.textContent = "Still buffering...";
    }
  }, 5000);
});
vid.addEventListener("playing", () => {
  clearTimeout(stallTimer);
  if (warn.textContent.startsWith("Still buffering")) warn.textContent = "";
});

// Track attention lapses as a data-quality flag rather than blocking them.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && started && !finished) blurEvents += 1;
});
window.addEventListener("blur", () => {
  if (started && !finished) warn.textContent = "Click the video to restore keyboard focus.";
});
stage.addEventListener("focus", () => {
  if (warn.textContent.startsWith("Click the video")) warn.textContent = "";
});
// Clicking anywhere on the stage restores focus, so keys keep registering.
stage.addEventListener("click", () => stage.focus());

window.addEventListener("message", (event) => {
  if (event.data.type === "streamlit:render") render(event.data.args);
});
window.addEventListener("resize", syncHeight);
try { window.parent.addEventListener("resize", syncHeight); } catch (e) {}

Streamlit.ready();
syncHeight();
</script>
</body>
</html>
